<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flim — офисный мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Левая панель -->
    <aside id="sidebar">
      <div id="user-profile">
        <div id="avatar" class="avatar" title="Изменить профиль">?</div>
        <span id="username-display"></span>
        <button id="logout-btn" title="Выйти">🚪</button>
      </div>
      <div id="search">
        <input type="text" placeholder="Поиск пользователей..." id="search-input">
        <div id="search-results" style="display:none;"></div>
      </div>
      <div id="chats-list"></div>
      <div id="sidebar-actions">
        <button id="create-group-btn">➕ Создать группу</button>
      </div>
    </aside>

    <!-- Правая панель -->
    <main id="chat">
      <header id="chat-header">
        <div id="chat-avatar" class="avatar">?</div>
        <div id="chat-title">flim</div>
        <div id="chat-status"></div>
      </header>
      <div id="messages-container">
        <div id="messages-list"></div>
      </div>
      <footer id="input-area">
        <!-- Кнопка прикрепления файлов -->
        <label for="file-input" id="attach-btn" title="Прикрепить файлы">📎</label>
        <input type="file" id="file-input" style="display:none;" multiple accept="image/*,video/*,.pdf,.doc,.docx,.txt">
        <!-- Поле ввода текста -->
        <input type="text" id="message-input" placeholder="Напишите сообщение..." disabled>
        <!-- Кнопка отправки -->
        <button id="send-btn" disabled>➤</button>
        <!-- Индикатор загруженных файлов (опционально) -->
        <span id="file-indicator" style="display:none; font-size:12px; color:#6c8cff;"></span>
      </footer>
    </main>
  </div>

  <!-- Модалка профиля -->
  <div id="profile-modal" style="display:none;">
    <div id="profile-modal-content">
      <h3>Редактировать профиль</h3>
      <div id="profile-avatar-container">
        <img id="profile-avatar-img" src="" alt="Аватар">
        <input type="file" id="avatar-upload" accept="image/*">
      </div>
      <textarea id="profile-bio" placeholder="О себе..."></textarea>
      <div id="profile-modal-actions">
        <button id="profile-save">Сохранить</button>
        <button id="profile-close">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модалка создания группы -->
  <div id="group-modal" style="display:none;">
    <div id="group-modal-content">
      <h3>Создать группу</h3>
      <input type="text" id="group-name" placeholder="Название группы">
      <div id="group-members-select">
        <p>Выберите участников:</p>
        <div id="group-members-list"></div>
      </div>
      <div id="group-modal-actions">
        <button id="group-create-confirm">Создать</button>
        <button id="group-modal-close">Отмена</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
